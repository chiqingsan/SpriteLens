# Nuitka 打包配置（SpriteLens）。
# 常用命令：
#   build.bat
#   build.bat --dry-run
#   .venv\Scripts\python.exe build.py
#   .venv\Scripts\python.exe build.py --dry-run

app_name = "SpriteLens"
# 中文显示名，仅用于打包产物命名；与 spritelens.APP_DISPLAY_NAME 保持一致。
app_display_name = "小洛探探"
product_name = "小洛探探 SpriteLens"
file_description = "洛克王国：世界 数据观测工具"
company_name = "SpriteLens"

entry = "main.py"

# 留空时读取 spritelens.__version__。
version = ""
file_version = ""

# 打包产物名称模板。可用变量：app_display_name、app_name、version、timestamp。
# 例：小洛探探_SpriteLens_1.0.0_10291234.exe
output_name_template = "{app_display_name}_{app_name}_{version}_{timestamp}"
# timestamp 为本地日期 MMDD + Unix 时间戳秒数的后四位，共八位，例如 10291234。

# GUI 程序：隐藏控制台窗口。
windowed = true

# 抓包需要 Npcap 驱动；发布 exe 启动时以管理员权限运行并触发 UAC，
# 便于安装驱动和执行需要提权的采集操作。源码启动与测试不受此配置影响。
uac_admin = true

# 产物形态：单文件 exe（体积换便携）。
onefile = true
standalone = true

# 保留 main.build / main.dist。发版构建本来就接近全量（Nuitka 的 __helpers.h 一变，
# 570+ 个翻译单元的 ccache manifest 同时失配），删掉省不下编译时间；留着才能在下次
# 构建前后对比 __helpers.h / __constants.h 定位失效来源，也省掉约 1.3GB 的删除重建 I/O。
# 磁盘吃紧时手动清 build\main.build、build\main.dist 即可。
remove_output = false
assume_yes_for_downloads = true
mingw64 = true

# Nuitka onefile 外层启动器在部分构建链上可能带入 GFNI 指令；关闭该指令
# 可避免部分 AMD CPU 在程序入口阶段触发非法指令崩溃，同时保留其它指令集能力。
# 末尾的 -O2 覆盖 Nuitka 自带的 -O3（gcc 取最后一个 -O 生效，实测命令行为
# "-O3 -mno-gfni -D_NUITKA_..."）：生成的 C 是 CPython C-API 胶水代码，-O3 的
# 向量化几乎无收益，却让 scapy 巨型翻译单元单文件编译到 360~482 秒，是全量构建
# 的主要拖尾。注意：改这里会让 ccache 全量失效一次。
backend_c_flags = ["-mno-gfni", "-O2"]

show_progress = true
show_memory = false

output_dir = "build"

icon = "resources/app.ico"

# Nuitka 插件：pywebview 插件是「强制启用」的（standalone 模式自动生效），
# 不能也不需要手动 --enable-plugin，否则会与其内部决策冲突：
# Nuitka 自行决定 webview.platforms.* 只收 Windows 相关分支，
# 若再用 --include-package=webview 强制全收，会报 "Conflict between user
# and plugin decision for module 'webview.platforms.android'"。
plugins = []

# pythonnet（clr）由 pywebview 的 Windows 后端动态 import；
# 显式带上确保运行时能加载 WebView2 程序集。
include_packages = [
  "clr_loader",
]

include_modules = [
  "clr",
  "pythonnet",
]

# 静态资源随包分发。`paths.project_root()` 在冻结态指向 exe 的解包目录，
# 所以 dest 必须与源码态的相对路径一致（data/、resources/）。
#
# 只显式收集发布必需的静态表与 schema；data/recordings 等运行数据绝不
# 随包分发（gitignore 约束不了 Nuitka 的目录收集，本地录制会混入发布包）。
#
# 注意 spritelens/web/static：它是包内资源（前端 HTML/CSS/JS/精灵图），
# Nuitka 只编译 .py，不会自动带上非 Python 文件。少了它的症状是服务启动
# 直接抛 `ValueError: '...\spritelens\web\static' does not exist`——
# 而 --smoke-test / --replay 等非 GUI 路径不加载静态资源，测不出来。
include_data_dirs = [
  "data/schemas=data/schemas",
  "spritelens/web/static=spritelens/web/static",
]

# data/static 中的导入报告与来源台账仅供开发工具使用，不进入发布包。
# 显式列出运行时表，避免把开发期元数据一起塞进单文件 exe。
include_data_files = [
  "data/static/color_cards.json=data/static/color_cards.json",
  "data/static/egg_descriptions.json=data/static/egg_descriptions.json",
  "data/static/egg_inventory.json=data/static/egg_inventory.json",
  "data/static/eggs.json=data/static/eggs.json",
  "data/static/medals.json=data/static/medals.json",
  "data/static/natures.json=data/static/natures.json",
  "data/static/pet_media.json=data/static/pet_media.json",
  "data/static/pet_media_manifest.json=data/static/pet_media_manifest.json",
  # 附近页的「NPC 配置 → 物种」显式映射：漏带时野生 NPC 名字全部退化成
  # 「未收录精灵 · 配置 N」，源码态有表所以只有发布包会踩。
  "data/static/scene_npc_pets.json=data/static/scene_npc_pets.json",
  "data/static/skills.json=data/static/skills.json",
  "data/static/specialities.json=data/static/specialities.json",
  "data/static/species.json=data/static/species.json",
  "data/static/type_chart.json=data/static/type_chart.json",
  "data/static/types.json=data/static/types.json",
  "data/static/wiki_reference.json=data/static/wiki_reference.json",
  # C13-02 起地图模式读取世界地图清单；底图本身随 spritelens/web/static 目录分发。
  "data/static/world_maps.json=data/static/world_maps.json",

  # 仅图标是运行资源；resources 下的 wiki/source 候选素材不进入发布包。
  "resources/app.ico=resources/app.ico",
]

# 排除确定用不到的大件，控制体积。
# 注意：不要排除 scapy 的任何子模块。实测排除 scapy.as_resolvers 后，
# 打包产物网卡枚举直接失败（"Module was actively excluded"），
# 而它其实在 scapy.arch.windows 的调用链上——scapy 内部动态 import 多，
# 静态排除极易误伤，体积收益也不值这个风险。
nofollow_imports = [
  "tkinter",
  "pytest",
  "IPython",
  "PyQt5",
  "PyQt6",
  "PySide2",
  "PySide6",
  "matplotlib",
  "pandas",
  "scipy",
  "notebook",
  "PIL._avif",
  "PIL.AvifImagePlugin",
  "zstandard",
]

# 额外原样传给 Nuitka 的参数。
additional_args = []
